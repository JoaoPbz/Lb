{% load filtros %}
{% if sinal %}{% if valor >= 0 %}{% firstof 'success' as cor %}{% else %}{% firstof 'danger' as cor %}{% endif %}{% endif %}
<div class="col-6 col-lg-3">
    <div class="card text-center h-100 border-{{ cor }}" title="{{ ajuda }}">
        <div class="card-body">
            <h6 class="card-title">{{ titulo }}</h6>
            <p class="card-text text-{{ cor }} fw-bold fs-5 mb-1">R$ {{ valor|moeda }}</p>
            <small class="text-muted">{{ ajuda }}</small>
        </div>
    </div>
</div>
