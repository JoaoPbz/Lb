{% load filtros %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Vendas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">LB Finanças</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'produtos' %}">Estoque</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'clientes' %}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'provas' %}">Provas</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'vendas' %}">Vendas</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'despesas' %}">Despesas</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-warning" href="#" data-bs-toggle="dropdown">💾 Backup</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="{% url 'backup' %}">Exportar Backup</a></li>
                        <li><a class="dropdown-item" href="{% url 'restaurar_backup' %}">Restaurar Backup</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
