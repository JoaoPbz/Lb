{% extends 'core/base.html' %}

{% block title %}Restaurar Backup{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">⚠️ Restaurar Backup</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-warning">
                    <strong>Atenção!</strong> Restaurar um backup apaga todos os dados atuais do sistema e os substitui pelos dados do arquivo. Essa ação não pode ser desfeita.
                </div>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Selecione o arquivo de backup (.json)</label>
                        <input type="file" name="arquivo" accept=".json" class="form-control" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Restaurar</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
