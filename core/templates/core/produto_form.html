{% extends 'core/base.html' %}

{% block title %}Editar Produto{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-dark text-white">
        <h5 class="mb-0">Editar Produto</h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Código da Marca</label>
                    <input type="text" name="codigo_marca" class="form-control form-control-lg" value="{{ produto.codigo_marca }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome" class="form-control form-control-lg" value="{{ produto.nome }}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Tamanho</label>
                    <input type="text" name="tamanho" class="form-control form-control-lg" value="{{ produto.tamanho }}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Cor</label>
                    <input type="text" name="cor" class="form-control form-control-lg" value="{{ produto.cor }}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Preço de Custo</label>
                    <input type="number" step="0.01" name="preco_custo" class="form-control form-control-lg" value="{{ produto.preco_custo }}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Preço de Venda</label>
                    <input type="number" step="0.01" name="preco_venda" class="form-control form-control-lg" value="{{ produto.preco_venda }}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Quantidade em Estoque</label>
                    <input type="number" name="quantidade_estoque" class="form-control form-control-lg" value="{{ produto.quantidade_estoque }}" required>
                </div>
            </div>
            <div class="d-flex gap-2 mt-2">
                <button type="submit" class="btn btn-success btn-lg">Salvar</button>
                <a href="{% url 'produtos' %}" class="btn btn-secondary btn-lg">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
