{% extends 'core/base.html' %}

{% block title %}Nova Compra{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Nova Compra</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Data da Compra</label>
                        <input type="date" name="data" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observações</label>
                        <textarea name="observacoes" class="form-control" rows="2"></textarea>
                    </div>

                    <hr>
                    <h6>Produtos desta compra</h6>

                    <div id="produtos-container">
                        <div class="border rounded p-3 mb-3 produto-row">
                            <div class="row g-2 mb-2">
                                <div class="col-md-4">
                                    <label class="form-label">Código</label>
                                    <input type="text" name="codigo_marca[]" class="form-control"
                                        placeholder="Código da marca" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Nome</label>
                                    <input type="text" name="nome[]" class="form-control" placeholder="Nome do produto"
                                        required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Tamanho</label>
                                    <input type="text" name="tamanho[]" class="form-control" placeholder="Ex: M, G, 42"
                                        required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Cor</label>
                                    <input type="text" name="cor[]" class="form-control" placeholder="Ex: Azul"
                                        required>
                                </div>
                            </div>
                            <div class="row g-2 align-items-end">
                                <div class="col-md-3">
                                    <label class="form-label">Preço de Custo</label>
                                    <input type="number" step="0.01" name="preco_custo[]" class="form-control"
                                        placeholder="0.00" required oninput="calcularTotal()">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Preço de Venda</label>
                                    <input type="number" step="0.01" name="preco_venda[]" class="form-control"
                                        placeholder="0.00" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Quantidade</label>
                                    <input type="number" name="quantidade[]" class="form-control" placeholder="1"
                                        min="1" value="1" required>
                                </div>
                                <div class="col-md-4">
                                    <button type="button" class="btn btn-danger w-100"
                                        onclick="removerLinha(this)">Remover Produto</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-secondary mb-3" onclick="adicionarLinha()">+ Adicionar
                        Produto</button>

                    <div class="alert alert-info">
                        <strong>Total de Custo: R$ <span id="total-custo">0.00</span></strong>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Salvar Compra</button>
                        <a href="{% url 'produtos' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function adicionarLinha() {
        const container = document.getElementById('produtos-container');
        const primeira = container.querySelector('.produto-row');
        const nova = primeira.cloneNode(true);
        nova.querySelectorAll('input').forEach(i => i.value = '');
        nova.querySelectorAll('input[name="preco_custo[]"]').forEach(i => i.setAttribute('oninput', 'calcularTotal()'));
        container.appendChild(nova);
    }

    function removerLinha(btn) {
        const container = document.getElementById('produtos-container');
        if (container.querySelectorAll('.produto-row').length > 1) {
            btn.closest('.produto-row').remove();
            calcularTotal();
        }
    }

    function calcularTotal() {
        const custos = document.querySelectorAll('input[name="preco_custo[]"]');
        let total = 0;
        custos.forEach(i => total += parseFloat(i.value) || 0);
        document.getElementById('total-custo').textContent = total.toFixed(2);
    }
</script>
{% endblock %}
