{% extends 'core/base.html' %}
{% load filtros %}

{% block title %}{% if despesa %}Editar Despesa{% else %}Nova Despesa{% endif %}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-dark text-white">
        <h5 class="mb-0">{% if despesa %}Editar Despesa{% else %}Nova Despesa{% endif %}</h5>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Descrição</label>
                    <input type="text" name="descricao" class="form-control" value="{{ despesa.descricao }}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Valor</label>
                    <input type="number" step="0.01" name="valor" class="form-control" value="{{ despesa.valor|moeda }}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Data</label>
                    <input type="date" name="data" class="form-control" value="{{ despesa.data }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Categoria</label>
                    <input type="text" name="categoria" class="form-control" value="{{ despesa.categoria }}" placeholder="Ex: MEI, Frete...">
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Salvar</button>
                <a href="{% url 'despesas' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
